name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pruebas automáticas en los tres sistemas
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  security:
    # Vulnerabilidades conocidas en las dependencias que van a producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t eticket:ci .
      - name: Arrancar y comprobar /healthz
        run: |
          docker run -d --name eticket -p 3000:3000 -e SESSION_SECRET="$(openssl rand -hex 32)" -e ALLOWED_DOMAIN=empresa.com eticket:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs eticket
          exit 1
      - name: Sin SESSION_SECRET no debe arrancar
        run: |
          if docker run --rm eticket:ci; then echo "debió fallar"; exit 1; fi
      - name: Con un SESSION_SECRET débil tampoco debe arrancar
        run: |
          if docker run --rm -e SESSION_SECRET=cambia-esto eticket:ci; then echo "debió fallar"; exit 1; fi

  stack:
    # Docker Compose completo: Caddy (HTTPS) + app + base de datos local en ./data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Preparar carpetas y .env con el asistente
        run: node scripts/setup.js --yes --mode docker --site localhost --tls internal --tz UTC
      - run: docker compose up -d --build
      - name: La app responde por HTTPS a través de Caddy
        run: |
          for i in $(seq 1 40); do
            curl -fsSk https://localhost/healthz && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - name: HTTP redirige a HTTPS
        run: curl -sS -o /dev/null -w '%{http_code}\n' http://localhost/ | grep -E '^30[1278]$'
      - name: La app no es accesible directamente (solo Caddy)
        run: if curl -fsS --max-time 3 http://localhost:3000/healthz; then echo "puerto 3000 expuesto"; exit 1; fi
      - name: La base de datos queda en ./data
        run: test -f data/eticket.db
      - name: Respaldo consistente
        run: |
          node scripts/backup.js --docker
          ls data/backups/eticket-*.db
      - name: Los datos sobreviven a recrear los contenedores
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 40); do curl -fsSk https://localhost/healthz && exit 0; sleep 1; done
          docker compose logs; exit 1

  testenv:
    # Ambiente de prueba (docker-compose.test.yml): siembra, login, ticket y aviso por correo en Mailpit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-env.sh up
      - name: Login como usuario y crear un ticket
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"email":"ana@empresa.com","password":"prueba1234"}' http://localhost:3000/api/login
          curl -fsS -b jar -H 'Content-Type: application/json' -d '{"title":"Ticket de prueba CI","description":"x","category":"Otro","priority":"alta"}' http://localhost:3000/api/tickets
      - name: Llega el aviso por correo a la bandeja de prueba
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8025/api/v1/messages | grep -q "Ticket de prueba CI" && exit 0
            sleep 1
          done
          docker compose -f docker-compose.test.yml logs
          exit 1
      - name: El personal de TI ve todos los tickets sembrados
        run: |
          curl -fsS -c jar2 -H 'Content-Type: application/json' -d '{"email":"tecnico@empresa.com","password":"prueba1234"}' http://localhost:3000/api/login
          test "$(curl -fsS -b jar2 http://localhost:3000/api/tickets | grep -o '"id":' | wc -l)" -ge 9
      - name: La siembra se niega a correr sin DEMO_SEED
        run: |
          if docker compose -f docker-compose.test.yml exec -T -e DEMO_SEED=false eticket node src/seedDemo.js; then
            echo "la siembra no debió ejecutarse"; exit 1
          fi

  native:
    # Instalación nativa (solo Node) en Windows, Linux y macOS: asistente, arranque, healthz y respaldo
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Asistente de instalación
        run: node scripts/setup.js --yes --mode native --domain empresa.com --admin admin@empresa.com --tz UTC
      - name: Arrancar y comprobar /healthz
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat server.log; exit 1; fi
      - name: Entrar a la interfaz y crear un usuario por registro local
        run: |
          curl -fsS -H 'Content-Type: application/json' -d '{"email":"ana@empresa.com","name":"Ana","password":"password123","department_id":3}' http://localhost:3000/api/register
      - name: Respaldo
        run: |
          node scripts/backup.js --dest backups
          ls backups

  installer:
    # El instalador de un comando para servidores Linux, de punta a punta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis y shellcheck
        run: |
          sh -n scripts/install-server.sh
          shellcheck scripts/install-server.sh
      - name: Instalar sin preguntas
        run: sudo SETUP_ARGS="--yes --domain empresa.com --admin admin@empresa.com --site localhost --tls internal --tz UTC" ./scripts/install-server.sh
      - name: El sistema responde por HTTPS y quedó configurado
        run: |
          curl -fsSk https://localhost/healthz
          sudo test -f /etc/cron.d/eticket-backup
          sudo test "$(sudo stat -c %a .env)" = "600"
      - name: Volver a ejecutarlo conserva la configuración
        run: |
          sudo cp .env /tmp/env.antes
          sudo SETUP_ARGS="--yes" ./scripts/install-server.sh
          sudo cmp .env /tmp/env.antes
          curl -fsSk https://localhost/healthz
      - name: El respaldo de las 2:00 funciona
        run: |
          sudo docker compose exec -T eticket node scripts/backup.js --dest /app/data/backups
          sudo ls data/backups
