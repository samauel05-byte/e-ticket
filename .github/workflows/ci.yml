name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t eticket:ci .
      - name: Arrancar y comprobar /healthz
        run: |
          docker run -d --name eticket -p 3000:3000 -e SESSION_SECRET=ci-secret -e ALLOWED_DOMAIN=empresa.com eticket:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/healthz && exit 0
            sleep 1
          done
          docker logs eticket
          exit 1
      - name: Sin SESSION_SECRET no debe arrancar
        run: |
          if docker run --rm eticket:ci; then echo "debió fallar"; exit 1; fi

  stack:
    # Docker Compose completo: Caddy (HTTPS) + app + base de datos local en ./data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar carpetas y .env
        run: |
          ./scripts/setup.sh
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-secret/' .env
          printf 'SITE_ADDRESS=localhost\nCADDY_TLS=internal\n' >> .env
      - run: docker compose up -d --build
      - name: La app responde por HTTPS a través de Caddy
        run: |
          for i in $(seq 1 40); do
            curl -fsSk https://localhost/healthz && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - name: HTTP redirige a HTTPS
        run: curl -sS -o /dev/null -w '%{http_code}\n' http://localhost/ | grep -E '^30[1278]$'
      - name: La app no es accesible directamente (solo Caddy)
        run: if curl -fsS --max-time 3 http://localhost:3000/healthz; then echo "puerto 3000 expuesto"; exit 1; fi
      - name: La base de datos queda en ./data
        run: test -f data/eticket.db
      - name: Respaldo consistente
        run: |
          ./scripts/backup-docker.sh
          ls data/backups/eticket-*.db
      - name: Los datos sobreviven a recrear los contenedores
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 40); do curl -fsSk https://localhost/healthz && exit 0; sleep 1; done
          docker compose logs; exit 1

  testenv:
    # Ambiente de prueba (docker-compose.test.yml): siembra, login, ticket y aviso por correo en Mailpit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-env.sh up
      - name: Login como usuario y crear un ticket
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"email":"ana@empresa.com","password":"prueba1234"}' http://localhost:3000/api/login
          curl -fsS -b jar -H 'Content-Type: application/json' -d '{"title":"Ticket de prueba CI","description":"x","category":"Otro","priority":"alta"}' http://localhost:3000/api/tickets
      - name: Llega el aviso por correo a la bandeja de prueba
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8025/api/v1/messages | grep -q "Ticket de prueba CI" && exit 0
            sleep 1
          done
          docker compose -f docker-compose.test.yml logs
          exit 1
      - name: El personal de TI ve todos los tickets sembrados
        run: |
          curl -fsS -c jar2 -H 'Content-Type: application/json' -d '{"email":"tecnico@empresa.com","password":"prueba1234"}' http://localhost:3000/api/login
          test "$(curl -fsS -b jar2 http://localhost:3000/api/tickets | grep -o '"id":' | wc -l)" -ge 9
      - name: La siembra se niega a correr sin DEMO_SEED
        run: |
          if docker compose -f docker-compose.test.yml exec -T -e DEMO_SEED=false eticket node src/seedDemo.js; then
            echo "la siembra no debió ejecutarse"; exit 1
          fi
