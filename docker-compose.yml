services:
  eticket:
    build: .
    restart: unless-stopped
    env_file: .env
    # La app no se expone al exterior: solo Caddy (HTTPS) llega a ella.
    expose:
      - "3000"
    # Endurecimiento del contenedor: sin privilegios extra, sistema de archivos de solo lectura (solo ./data se escribe)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 200
    volumes:
      # Base de datos (SQLite) y adjuntos en una carpeta LOCAL del servidor: ./data
      - ./data:/app/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - eticket
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 200
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro            # certificado propio de la empresa (opcional)
      - caddy_data:/data             # autoridad interna y certificados emitidos
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
